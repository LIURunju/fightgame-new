<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火柴人格斗游戏 - Stickman Fighter</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            user-select: none;
            overflow: hidden;
        }
        canvas {
            background: linear-gradient(to bottom, #0f172a, #1e293b);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- 游戏主容器 -->
    <div class="relative w-full max-w-4xl flex flex-col items-center">
        <!-- 标题栏与 UI 布局 -->
        <div class="w-full flex justify-between items-center mb-3 px-2">
            <h1 class="text-3xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-400">
                奥特曼格斗 <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">ULTRA FIGHT</span>
            </h1>
            <div class="text-xs text-slate-400 flex items-center gap-4">
                <span>1P: <strong class="text-cyan-400">赛罗 (W A S D + U I J K)</strong></span>
                <span>2P: <strong class="text-rose-500">贝利亚 (AI)</strong></span>
                <button id="bgm-toggle-btn" onclick="toggleBGM()" class="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-cyan-500/30 text-xs font-bold transition-all">
                    🎵 BGM: 开
                </button>
            </div>
        </div>

        <!-- 游戏画布区 -->
        <div class="relative w-full aspect-[16/9] rounded-2xl overflow-hidden border border-slate-700/60 shadow-2xl">
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>

            <!-- 准备/倒计时/胜负与通关结算 Overlay -->
            <div id="game-over-overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center gap-4 hidden z-20">
                <h2 id="winner-text" class="text-4xl sm:text-5xl font-black text-amber-400 tracking-wider">P1 胜利!</h2>
                <p id="stage-subtext" class="text-slate-300 text-sm font-semibold">准备迎战下一关卡！</p>
                <div class="flex gap-4">
                    <button id="next-stage-btn" onclick="nextStage()" class="px-8 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold text-lg shadow-lg hover:shadow-emerald-500/25 transition-all transform hover:-translate-y-0.5 active:translate-y-0">
                        下一关 NEXT STAGE
                    </button>
                    <button id="restart-btn" onclick="restartGame()" class="px-8 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold text-lg shadow-lg hover:shadow-cyan-500/25 transition-all transform hover:-translate-y-0.5 active:translate-y-0">
                        重新开始
                    </button>
                </div>
            </div>

            <!-- 开局 Start 界面 -->
            <div id="start-screen-overlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center gap-6 z-30">
                <div class="text-center">
                    <h2 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-200 to-rose-500 mb-2">ULTRA FIGHT: ZERO vs BELIAL</h2>
                    <p class="text-slate-400 text-sm">赛罗 VS 贝利亚 · 宿命之战</p>
                </div>
                <button onclick="initStartSequence()" class="px-10 py-4 rounded-2xl bg-gradient-to-r from-cyan-500 via-sky-500 to-rose-600 hover:from-cyan-400 hover:to-rose-500 text-white font-black text-xl shadow-xl hover:shadow-cyan-500/30 transition-all transform hover:-translate-y-1 active:translate-y-0">
                    START 决战开始
                </button>
            </div>

            <!-- 3 秒 Countdown 标识 -->
            <div id="countdown-overlay" class="absolute inset-0 flex items-center justify-center pointer-events-none hidden z-10">
                <span id="countdown-text" class="text-8xl font-black text-amber-400 drop-shadow-[0_10px_10px_rgba(0,0,0,0.8)] animate-bounce">3</span>
            </div>
        </div>

        <!-- 触屏虚拟手柄 (Mobile Virtual Touch Controls) -->
        <div id="touch-controls" class="w-full mt-4 flex justify-between items-center gap-2 select-none px-2">
            <!-- 左侧方向键 -->
            <div class="relative w-36 h-36 bg-slate-800/50 rounded-full border border-slate-700/60 p-2 flex items-center justify-center shadow-inner">
                <button id="btn-w" class="absolute top-1 w-11 h-11 bg-slate-700/80 active:bg-cyan-500 rounded-xl text-white font-bold shadow flex items-center justify-center text-sm">W</button>
                <button id="btn-a" class="absolute left-1 w-11 h-11 bg-slate-700/80 active:bg-cyan-500 rounded-xl text-white font-bold shadow flex items-center justify-center text-sm">A</button>
                <button id="btn-s" class="absolute bottom-1 w-11 h-11 bg-slate-700/80 active:bg-cyan-500 rounded-xl text-white font-bold shadow flex items-center justify-center text-sm">S</button>
                <button id="btn-d" class="absolute right-1 w-11 h-11 bg-slate-700/80 active:bg-cyan-500 rounded-xl text-white font-bold shadow flex items-center justify-center text-sm">D</button>
            </div>

            <!-- 右侧技能攻击按键区 (十字菱形分布) -->
            <div class="relative w-36 h-36 bg-slate-800/50 rounded-full border border-slate-700/60 p-2 flex items-center justify-center shadow-inner">
                <button id="btn-u" class="absolute top-1 w-11 h-11 bg-cyan-600/90 active:bg-cyan-400 rounded-full text-white font-black text-sm shadow">U</button>
                <button id="btn-j" class="absolute left-1 w-11 h-11 bg-amber-600/90 active:bg-amber-400 rounded-full text-white font-black text-sm shadow">J</button>
                <button id="btn-k" class="absolute right-1 w-11 h-11 bg-rose-600/90 active:bg-rose-400 rounded-full text-full text-white font-black text-sm shadow">K</button>
                <button id="btn-i" class="absolute bottom-1 w-11 h-11 bg-sky-600/90 active:bg-sky-400 rounded-full text-white font-black text-sm shadow">I</button>
            </div>
        </div>

        <!-- 招式卡片说明 -->
        <div class="w-full grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4 text-xs">
            <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
                <span class="text-cyan-400 font-bold block mb-1">基本拳脚</span>
                <span class="text-slate-300">U: 轻拳 | J: 重拳</span><br>
                <span class="text-slate-300">I: 轻脚 | K: 重脚</span>
            </div>
            <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
                <span class="text-cyan-400 font-bold block mb-1">波动拳 (S ➔ D + U/J)</span>
                <span class="text-slate-300">飞行道具 / 0.5s 后摇</span>
            </div>
            <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
                <span class="text-amber-400 font-bold block mb-1">超级大波 (S ➔ D ➔ S ➔ D + U/J)</span>
                <span class="text-slate-300">长按无限蓄力 / 吸附小波</span>
            </div>
            <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
                <span class="text-indigo-400 font-bold block mb-1">必杀特技</span>
                <span class="text-slate-300">升龙拳: D ➔ S ➔ D + U/J</span><br>
                <span class="text-slate-300">迅猛飞踢: S ➔ D + I/K</span>
            </div>
        </div>
    </div>

    <!-- 逻辑 JavaScript 全编 -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 450;
        const GROUND_Y = 380;
        const GRAVITY = 0.65;

        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        let gameRunning = false;
        let isCountingDown = false;
        let countdownValue = 3;

        // 关卡系统变量 (Stage System)
        let currentStage = 1;
        const MAX_STAGE = 3;

        // 关卡参数定义
        const STAGE_CONFIGS = {
            1: { name: 'STAGE 1: 恶魔觉醒', hp: 100, scale: 1.0, dmgMul: 1.0, speedMul: 1.0, colorTimer: '#c084fc' },
            2: { name: 'STAGE 2: 黑暗暴走', hp: 165, scale: 1.25, dmgMul: 1.4, speedMul: 1.2, colorTimer: '#e11d48' },
            3: { name: 'STAGE 3: 终极极恶', hp: 250, scale: 1.55, dmgMul: 2.0, speedMul: 1.35, colorTimer: '#ef4444' }
        };

        // 按键监听表
        const keys = {};

        window.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            if (!keys[key]) {
                keys[key] = true;
                if (player && gameRunning && !isCountingDown) {
                    player.handleCommandBuffer(key);
                }
            }
        });

        window.addEventListener('keyup', e => {
            const key = e.key.toLowerCase();
            keys[key] = false;

            // 释放超级大波
            if ((key === 'u' || key === 'j') && player && player.state === 'charging') {
                player.releaseSuperHadouken();
            }
        });

        // 触屏虚拟按键绑逻辑 (Touch Event Binding)
        function bindTouchButton(btnId, keyName) {
            const btn = document.getElementById(btnId);
            if (!btn) return;

            const handlePress = (e) => {
                e.preventDefault();
                if (!keys[keyName]) {
                    keys[keyName] = true;
                    if (player && gameRunning && !isCountingDown) {
                        player.handleCommandBuffer(keyName);
                    }
                }
            };

            const handleRelease = (e) => {
                e.preventDefault();
                keys[keyName] = false;
                if ((keyName === 'u' || keyName === 'j') && player && player.state === 'charging') {
                    player.releaseSuperHadouken();
                }
            };

            btn.addEventListener('touchstart', handlePress, { passive: false });
            btn.addEventListener('touchend', handleRelease, { passive: false });
            btn.addEventListener('mousedown', handlePress);
            btn.addEventListener('mouseup', handleRelease);
        }

        // 绑定所有触屏虚拟按键
        ['w', 'a', 's', 'd', 'u', 'i', 'j', 'k'].forEach(k => {
            bindTouchButton(`btn-${k}`, k);
        });

        // 全局全局导出 START 方法
        window.initStartSequence = function() {
            document.getElementById('start-screen-overlay').classList.add('hidden');
            // 初始化/解锁 AudioContext 播放音频权限
            initAudio();
            playAudioEffect('shoryuken');
            restartGame();
        };

        // ---- Web Audio API 纯代码打撃与技能音效引擎 (Audio Engine) ----
        let audioCtx = null;
        let bgmInterval = null;
        let bgmEnabled = true;
        let bgmNoteIndex = 0;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 紧张刺激背景音乐 (Combat Synthwave BGM Loop Engine)
        const BGM_BASE_NOTES = [110, 110, 130.81, 110, 146.83, 130.81, 110, 98.00, 110, 110, 164.81, 146.83, 130.81, 110, 123.47, 98.00];

        function startBGM() {
            stopBGM();
            if (!bgmEnabled) return;
            initAudio();

            // 根据关卡增加 BGM 节奏速度 (BPM 随着关卡递增)
            const stageTempo = [200, 165, 135][currentStage - 1] || 180;

            bgmInterval = setInterval(() => {
                if (!audioCtx || !gameRunning || isCountingDown || !bgmEnabled) return;

                const now = audioCtx.currentTime;
                const freq = BGM_BASE_NOTES[bgmNoteIndex % BGM_BASE_NOTES.length];

                // 双振荡器低音合成器 (Dual-Oscillator Synth Bass)
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();

                osc1.type = 'sawtooth';
                osc2.type = 'square';

                osc1.frequency.setValueAtTime(freq, now);
                osc2.frequency.setValueAtTime(freq * 1.005, now); // 微小失调增强音质厚度

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800 + (currentStage * 300), now);
                filter.Q.setValueAtTime(4, now);

                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + (stageTempo / 1000) * 0.9);

                osc1.connect(filter);
                osc2.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + (stageTempo / 1000));
                osc2.stop(now + (stageTempo / 1000));

                bgmNoteIndex++;
            }, stageTempo);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        window.toggleBGM = function() {
            bgmEnabled = !bgmEnabled;
            const btn = document.getElementById('bgm-toggle-btn');
            if (bgmEnabled) {
                btn.textContent = "🎵 BGM: 开";
                btn.className = "px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-cyan-500/30 text-xs font-bold transition-all";
                if (gameRunning && !isCountingDown) startBGM();
            } else {
                btn.textContent = "🔇 BGM: 关";
                btn.className = "px-3 py-1 rounded-lg bg-slate-900 text-slate-500 border border-slate-700 text-xs font-bold transition-all";
                stopBGM();
            }
        };

        function playAudioEffect(type) {
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            if (type === 'punch') {
                // 击拳音效 (High-pitch strike + Noise snap)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.1);

            } else if (type === 'heavy_punch' || type === 'kick') {
                // 重拳/飞踢沉闷中音 (Thud Impact)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(25, now + 0.15);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.15);

            } else if (type === 'block') {
                // 成功防御 (Metallic Guard Snap)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.08);

            } else if (type === 'hadouken') {
                // 波动拳发波音效 (Whoosh energy)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(90, now + 0.25);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.25);

            } else if (type === 'shoryuken') {
                // 升龙拳破空音效 (Rising sweep)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.3);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.3);

            } else if (type === 'explosion') {
                // 大波吞噬/重创爆破 (Heavy Explosion Impact)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(90, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.35);
                gain.gain.setValueAtTime(0.7, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            }
        }

        function restartGame() {
            currentStage = 1;
            document.getElementById('game-over-overlay').classList.add('hidden');
            player = new Stickman(200, '#38bdf8', false);
            setupAIForStage(currentStage);
            projectiles = [];
            attackEffects = [];
            floatingTexts = [];
            gameRunning = true;
            startCountdown();
        }

        function nextStage() {
            if (currentStage < MAX_STAGE) {
                currentStage++;
            }
            document.getElementById('game-over-overlay').classList.add('hidden');

            // 保持玩家血量恢复 40%
            if (player) {
                player.hp = Math.min(100, player.hp + 40);
                player.x = 200;
                player.y = GROUND_Y;
                player.state = 'idle';
            } else {
                player = new Stickman(200, '#38bdf8', false);
            }

            setupAIForStage(currentStage);
            projectiles = [];
            attackEffects = [];
            floatingTexts = [];
            gameRunning = true;
            startCountdown();
        }

        function setupAIForStage(stageNum) {
            const cfg = STAGE_CONFIGS[stageNum];
            ai = new Stickman(600, '#f43f5e', true);
            ai.maxHp = cfg.hp;
            ai.hp = cfg.hp;
            ai.scale = cfg.scale;
            ai.dmgMultiplier = cfg.dmgMul;
            ai.speedMultiplier = cfg.speedMul;
        }

        function startCountdown() {
            isCountingDown = true;
            countdownValue = 3;
            stopBGM();
            const overlay = document.getElementById('countdown-overlay');
            const textEl = document.getElementById('countdown-text');
            overlay.classList.remove('hidden');
            textEl.textContent = countdownValue;

            const interval = setInterval(() => {
                countdownValue--;
                if (countdownValue > 0) {
                    textEl.textContent = countdownValue;
                } else if (countdownValue === 0) {
                    textEl.textContent = 'FIGHT!';
                } else {
                    clearInterval(interval);
                    overlay.classList.add('hidden');
                    isCountingDown = false;
                    startBGM(); // 开局倒计时结束立刻启动紧张 BGM
                }
            }, 800);

            requestAnimationFrame(gameLoop);
        }

        // 飞行道具类
        class Projectile {
            constructor(x, y, dir, isSuper = false, chargeTime = 0, dmgMul = 1.0, scale = 1.0) {
                this.x = x;
                this.y = y;
                this.dir = dir;
                this.isSuper = isSuper;

                if (isSuper) {
                    const chargeLevel = Math.floor(chargeTime / 30);
                    this.speed = 6 * (1 + chargeLevel * 0.4);
                    this.damage = 6 * (1 + chargeLevel * 0.5) * dmgMul;
                    this.radius = (18 + chargeLevel * 3) * scale;
                } else {
                    this.speed = 4.5;
                    this.damage = 10 * dmgMul;
                    this.radius = 8 * scale;
                }

                this.active = true;
                this.devouredCount = 0;
            }

            devourSmallWave() {
                if (this.devouredCount < 6) {
                    this.devouredCount++;
                    this.damage += 2;
                    this.speed += 0.5;
                    this.radius += 4;
                    return true;
                }
                return false;
            }

            update() {
                this.x += this.dir * this.speed;
                if (this.x < -50 || this.x > GAME_WIDTH + 50) {
                    this.active = false;
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.isSuper ? '#f59e0b' : '#38bdf8';
                ctx.shadowColor = this.isSuper ? '#fbbf24' : '#0284c7';
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.restore();
            }
        }

        // 浮动文字特效类
        class FloatingText {
            constructor(text, x, y, color = '#f59e0b') {
                this.text = text;
                this.x = x;
                this.y = y;
                this.color = color;
                this.alpha = 1.0;
                this.vy = -1.5;
            }

            update() {
                this.y += this.vy;
                this.alpha -= 0.025;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = '900 16px Inter, sans-serif';
                ctx.fillStyle = this.color;
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // 打击/攻击特效类 (拳脚视觉特效)
        class AttackEffect {
            constructor(x, y, dir, type = 'punch') {
                this.x = x;
                this.y = y;
                this.dir = dir;
                this.type = type;
                this.life = 12;
                this.maxLife = 12;
            }

            update() {
                this.life--;
            }

            draw(ctx) {
                if (this.life <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                const progress = 1 - (this.life / this.maxLife);
                ctx.globalAlpha = 1 - progress;

                if (this.type.includes('punch')) {
                    const radius = 10 + progress * 25;
                    ctx.beginPath();
                    ctx.arc(0, 0, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = this.type.includes('heavy') ? '#f59e0b' : '#38bdf8';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    for (let i = 0; i < 6; i++) {
                        const angle = (Math.PI * 2 / 6) * i;
                        const innerR = radius * 0.5;
                        const outerR = radius * 1.3;
                        ctx.beginPath();
                        ctx.moveTo(Math.cos(angle) * innerR, Math.sin(angle) * innerR);
                        ctx.lineTo(Math.cos(angle) * outerR, Math.sin(angle) * outerR);
                        ctx.strokeStyle = '#fbbf24';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                } else if (this.type.includes('kick')) {
                    ctx.scale(this.dir, 1);
                    ctx.beginPath();
                    ctx.arc(0, 0, 20 + progress * 20, -Math.PI / 3, Math.PI / 3);
                    ctx.strokeStyle = this.type.includes('heavy') ? '#e11d48' : '#06b6d4';
                    ctx.lineWidth = 5;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(5, 0, 15 + progress * 20, -Math.PI / 4, Math.PI / 4);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        // 火柴人角色类
        class Stickman {
            constructor(x, color, isAI = false) {
                this.x = x;
                this.y = GROUND_Y;
                this.color = color;
                this.isAI = isAI;

                this.vx = 0;
                this.vy = 0;
                this.facing = isAI ? -1 : 1;

                this.maxHp = 100;
                this.hp = 100;
                this.scale = 1.0;
                this.dmgMultiplier = 1.0;
                this.speedMultiplier = 1.0;

                this.state = 'idle'; // idle, move, attack, shoryuken, flyingkick, charging, knockdown, recovery
                this.stateTimer = 0;
                this.isGuard = false;
                this.isInvincible = false;

                this.chargeTimer = 0;
                this.cmdBuffer = [];
                this.currentAttackType = null;
            }

            handleCommandBuffer(key) {
                const now = Date.now();
                this.cmdBuffer.push({ key, time: now });
                this.cmdBuffer = this.cmdBuffer.filter(c => now - c.time <= 1200);

                const cmds = this.cmdBuffer.map(c => c.key);
                const cmdStr = cmds.join('');

                const forward = this.facing === 1 ? 'd' : 'a';
                const isPunch = key === 'u' || key === 'j';
                const isKick = key === 'i' || key === 'k';

                if (this.state !== 'idle' && this.state !== 'move') return;

                if (isPunch) {
                    const sCount = cmds.filter(k => k === 's').length;
                    const fCount = cmds.filter(k => k === forward).length;

                    // 超级大波优先指令判定
                    if (sCount >= 2 && fCount >= 2) {
                        this.startSuperHadoukenCharge();
                        this.cmdBuffer = [];
                        return;
                    }

                    // 升龙拳: 前 下 前 + 拳
                    if (cmdStr.includes(forward + 's' + forward) || (sCount >= 1 && fCount >= 2)) {
                        this.performShoryuken();
                        this.cmdBuffer = [];
                        return;
                    }

                    // 普通波动拳: 下 前 + 拳
                    if (cmdStr.includes('s' + forward) || (sCount >= 1 && fCount >= 1)) {
                        this.performHadouken();
                        this.cmdBuffer = [];
                        return;
                    }

                    // 普通拳击
                    this.performNormalAttack(key === 'j' ? 'heavy_punch' : 'punch');
                    this.cmdBuffer = [];
                    return;
                }

                // 迅猛飞踢: 下 前 + 脚
                if (isKick) {
                    if (cmdStr.includes('s' + forward) || (cmds.includes('s') && cmds.includes(forward))) {
                        this.performFlyingKick();
                        this.cmdBuffer = [];
                        return;
                    }

                    // 普通脚踢
                    this.performNormalAttack(key === 'k' ? 'heavy_kick' : 'kick');
                    this.cmdBuffer = [];
                    return;
                }
            }

            performNormalAttack(type) {
                this.state = 'attack';
                this.stateTimer = 15;
                this.currentAttackType = type;

                // 如果处于下蹲状态按 K，切换为蹲重踢(扫堂腿)动作
                if (type === 'heavy_kick' && keys['s'] && this.y === GROUND_Y) {
                    this.currentAttackType = 'crouch_heavy_kick';
                }

                const effectX = this.x + this.facing * 30;
                const effectY = type.includes('kick') ? (keys['s'] ? this.y - 10 : this.y - 20) : this.y - 35;
                attackEffects.push(new AttackEffect(effectX, effectY, this.facing, type));
            }

            performHadouken() {
                this.state = 'attack';
                this.stateTimer = 30; // 0.5秒发波硬直
                this.currentAttackType = 'hadouken';
                this.isGuard = false;
                playAudioEffect('hadouken');
                projectiles.push(new Projectile(this.x + this.facing * 25 * this.scale, this.y - 35 * this.scale, this.facing, false, 0, this.dmgMultiplier, this.scale));
            }

            performFlyingKick() {
                this.state = 'flyingkick';
                this.stateTimer = 35;
                this.vx = this.facing * 8 * this.speedMultiplier;
                this.vy = -3;
                this.isGuard = false;
                playAudioEffect('kick');
                attackEffects.push(new AttackEffect(this.x + this.facing * 20 * this.scale, this.y - 25 * this.scale, this.facing, 'heavy_kick'));
            }

            performShoryuken() {
                this.state = 'shoryuken';
                this.stateTimer = 45;
                this.vy = -12;
                this.vx = this.facing * 3 * this.speedMultiplier;
                this.isInvincible = true;
                playAudioEffect('shoryuken');
                attackEffects.push(new AttackEffect(this.x + this.facing * 15 * this.scale, this.y - 45 * this.scale, this.facing, 'heavy_punch'));
            }

            startSuperHadoukenCharge() {
                this.state = 'charging';
                this.chargeTimer = 0;
                this.isGuard = false;
                playAudioEffect('hadouken');
            }

            releaseSuperHadouken() {
                if (this.state === 'charging') {
                    projectiles.push(new Projectile(this.x + this.facing * 30 * this.scale, this.y - 35 * this.scale, this.facing, true, this.chargeTimer, this.dmgMultiplier, this.scale));
                    this.state = 'attack';
                    this.stateTimer = 30;
                    this.chargeTimer = 0;
                    playAudioEffect('explosion');
                }
            }

            takeHit(damage, isKnockdown = false, vx = 0, vy = 0) {
                if (this.isInvincible) return;

                if (this.isGuard && !isKnockdown) {
                    this.hp -= damage * 0.1;
                    playAudioEffect('block');
                    return;
                }

                this.hp -= damage;
                playAudioEffect(isKnockdown ? 'explosion' : 'punch');
                if (isKnockdown) {
                    this.state = 'knockdown';
                    this.stateTimer = 120; // 强制倒地 2 秒 (120帧)
                    this.isInvincible = true;
                    this.vx = vx;
                    this.vy = vy;
                } else {
                    this.state = 'hit';
                    this.stateTimer = 15;
                }
            }

            update(opponent, projectiles, floatingTexts) {
                if (this.state === 'idle' || this.state === 'move') {
                    this.facing = opponent.x > this.x ? 1 : -1;
                }

                this.y += this.vy;
                this.x += this.vx;

                if (this.y < GROUND_Y) {
                    this.vy += GRAVITY;
                } else {
                    this.y = GROUND_Y;
                    this.vy = 0;
                    this.vx *= 0.8;

                    if (this.state === 'shoryuken' && this.stateTimer < 20) {
                        this.state = 'recovery';
                        this.stateTimer = 30; // 0.5s 落地僵直
                        this.isInvincible = false;
                    }
                }

                if (this.stateTimer > 0) {
                    this.stateTimer--;
                    if (this.stateTimer === 0) {
                        const wasKnockdown = this.state === 'knockdown';
                        if (wasKnockdown) {
                            this.isInvincible = false;
                        }
                        this.state = 'idle';
                        this.isGuard = false;

                        // 倒地起身即时检查防御 (Wake-up Guard Protection)
                        if (wasKnockdown) {
                            const backKey = this.facing === 1 ? 'a' : 'd';
                            if (keys[backKey] || keys['s']) {
                                this.isGuard = true;
                            }
                        }
                    }
                }

                if (this.state === 'charging') {
                    this.chargeTimer++;
                    this.isGuard = false;

                    projectiles.forEach((p) => {
                        if (p.active && !p.isSuper && p.dir !== this.facing) {
                            const dist = Math.hypot(p.x - this.x, p.y - (this.y - 35));
                            if (dist < 40) {
                                p.active = false;
                                floatingTexts.push(new FloatingText("吞噬+1!", this.x, this.y - 60, '#f59e0b'));
                            }
                        }
                    });

                    if (!this.isAI && !keys['u'] && !keys['j']) {
                        this.releaseSuperHadouken();
                    }
                }

                if (!this.isAI && gameRunning && !isCountingDown) {
                    this.handlePlayerMovement();
                }

                if (this.isAI && gameRunning && !isCountingDown) {
                    this.handleAIBehavior(opponent);
                }

                this.x = Math.max(30, Math.min(GAME_WIDTH - 30, this.x));
            }

            handlePlayerMovement() {
                if (this.state !== 'idle' && this.state !== 'move') return;

                let speed = 2.2;
                this.isGuard = false;

                if (keys['s'] && this.y === GROUND_Y) {
                    this.state = 'move';
                    this.isGuard = true;
                    return;
                }

                if (keys['a']) {
                    this.x -= speed;
                    this.state = 'move';
                    if (this.facing === 1) this.isGuard = true;
                } else if (keys['d']) {
                    this.x += speed;
                    this.state = 'move';
                    if (this.facing === -1) this.isGuard = true;
                } else {
                    this.state = 'idle';
                }

                // 起身或站立防守时按后退键保持防守姿态
                const backKey = this.facing === 1 ? 'a' : 'd';
                if (keys[backKey] || keys['s']) {
                    this.isGuard = true;
                }

                if (keys['w'] && this.y === GROUND_Y) {
                    this.vy = -11;
                }
            }

            handleAIBehavior(opponent) {
                if (this.state !== 'idle' && this.state !== 'move') return;

                const dist = Math.abs(opponent.x - this.x);
                let speed = 2.0 * this.speedMultiplier;

                const incomingProjectile = projectiles.find(p => p.active && p.dir !== this.facing && Math.abs(p.x - this.x) < 220);

                if (incomingProjectile) {
                    const projDist = Math.abs(incomingProjectile.x - this.x);
                    if (projDist < 120 && this.y === GROUND_Y && Math.random() < 0.75) {
                        this.vy = -11;
                        this.vx = (Math.random() < 0.5 ? -1 : 1) * 2 * this.speedMultiplier;
                        return;
                    } else if (projDist >= 120 && projDist < 200 && Math.random() < 0.35) {
                        this.performHadouken();
                        return;
                    } else if (projDist < 150) {
                        this.x -= this.facing * speed;
                        this.isGuard = true;
                        return;
                    }
                }

                if (dist > 250) {
                    if (Math.random() < 0.03) {
                        this.performHadouken();
                    } else if (Math.random() < 0.015) {
                        this.performFlyingKick();
                    } else {
                        this.x += this.facing * speed;
                    }
                } else if (dist > 100) {
                    if (opponent.state === 'attack' || opponent.state === 'shoryuken') {
                        if (Math.random() < 0.05) this.performFlyingKick();
                        else {
                            this.x -= this.facing * speed;
                            this.isGuard = true;
                        }
                    } else {
                        if (Math.random() < 0.02) this.performHadouken();
                        else this.x += this.facing * (speed * 0.8);
                    }
                } else {
                    if (opponent.state === 'attack' || opponent.state === 'flyingkick') {
                        this.isGuard = true;
                        if (Math.random() < 0.04 && this.y === GROUND_Y) {
                            this.performShoryuken();
                        }
                    } else if (Math.random() < 0.04) {
                        this.performShoryuken();
                    } else if (Math.random() < 0.03) {
                        this.x -= this.facing * speed;
                    } else {
                        this.isGuard = Math.random() < 0.4;
                    }
                }
            }

            // 图像级 HD 超高精细度 3D 质态奥特曼模型渲染引擎（支持缩放 Scale）
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);

                if (this.state === 'knockdown') {
                    ctx.translate(0, -10);
                    ctx.rotate((this.facing * Math.PI) / 2);
                }

                const isBelial = this.isAI;
                const f = this.facing;
                const isCrouching = keys['s'] && !this.isAI && this.y === GROUND_Y && (this.state === 'idle' || this.state === 'move');

                // 配色方案与多重光影
                const colMain = isBelial ? '#18181b' : '#0284c7';
                const colSub = isBelial ? '#dc2626' : '#ef4444';
                const colArmor = isBelial ? '#3f3f46' : '#f8fafc';
                const colEye = isBelial ? '#ff1744' : '#fde047';
                const colTimer = isBelial ? STAGE_CONFIGS[currentStage].colorTimer : '#38bdf8';

                // 超精细立体肌肉肢体绘制系统 (3D Metallic Muscular Capsule)
                const drawLimb = (x1, y1, x2, y2, w1, w2, color, strokeColor, isArm = false) => {
                    ctx.save();
                    const angle = Math.atan2(y2 - y1, x2 - x1);
                    const length = Math.hypot(x2 - x1, y2 - y1);

                    ctx.translate(x1, y1);
                    ctx.rotate(angle);

                    // 多层高光渐变
                    const grad = ctx.createLinearGradient(0, -w1, 0, w1);
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.25, isBelial ? '#3f3f46' : '#93c5fd');
                    grad.addColorStop(0.65, color);
                    grad.addColorStop(1, '#09090b');

                    ctx.beginPath();
                    ctx.moveTo(0, -w1);
                    ctx.lineTo(length, -w2);
                    ctx.arc(length, 0, w2, -Math.PI / 2, Math.PI / 2);
                    ctx.lineTo(0, w1);
                    ctx.arc(0, 0, w1, Math.PI / 2, -Math.PI / 2);
                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.strokeStyle = strokeColor || '#020617';
                    ctx.lineWidth = 1.4;
                    ctx.stroke();

                    // 贝利亚恶魔利爪 (Giga Battle Claws)
                    if (isBelial && isArm && length > 25) {
                        ctx.beginPath();
                        ctx.moveTo(length, -w2);
                        ctx.lineTo(length + 10 * f, -w2 - 4);
                        ctx.moveTo(length, 0);
                        ctx.lineTo(length + 12 * f, 0);
                        ctx.moveTo(length, w2);
                        ctx.lineTo(length + 10 * f, w2 + 4);
                        ctx.strokeStyle = '#ef4444';
                        ctx.lineWidth = 2.5;
                        ctx.stroke();
                    }

                    ctx.restore();
                };

                // ---- 1. HD 照片级超精细头雕 (HD Photorealistic Ultra Helmet) ----
                const drawUltraHead = (hx, hy) => {
                    ctx.save();
                    ctx.translate(hx, hy);

                    // 精密头部雕刻面
                    ctx.beginPath();
                    ctx.moveTo(-11 * f, -28);
                    ctx.bezierCurveTo(-15 * f, -12, -12 * f, 8, 0, 12);
                    ctx.bezierCurveTo(12 * f, 8, 15 * f, -12, 11 * f, -28);
                    ctx.closePath();

                    const headGrad = ctx.createLinearGradient(-11 * f, -28, 11 * f, 12);
                    headGrad.addColorStop(0, isBelial ? '#52525b' : '#f8fafc');
                    headGrad.addColorStop(0.4, isBelial ? '#18181b' : '#0284c7');
                    headGrad.addColorStop(1, '#09090b');
                    ctx.fillStyle = headGrad;
                    ctx.fill();
                    ctx.strokeStyle = isBelial ? '#b91c1c' : '#38bdf8';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    if (isBelial) {
                        // 贝利亚霸气邪恶弯角 (Giga Arc Horns)
                        ctx.beginPath();
                        ctx.moveTo(-4 * f, -24);
                        ctx.bezierCurveTo(-32 * f, -60, 14 * f, -65, 30 * f, -36);
                        ctx.bezierCurveTo(16 * f, -34, 4 * f, -26, -2 * f, -20);
                        ctx.fillStyle = '#09090b';
                        ctx.fill();
                        ctx.strokeStyle = '#dc2626';
                        ctx.lineWidth = 2.5;
                        ctx.stroke();
                    } else {
                        // 赛罗立体精细双头镖 (Zero Sluggers)
                        ctx.beginPath();
                        ctx.moveTo(-5 * f, -24);
                        ctx.lineTo(18 * f, -54);
                        ctx.lineTo(7 * f, -22);
                        ctx.fillStyle = '#f8fafc';
                        ctx.fill();
                        ctx.strokeStyle = '#0284c7';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        // 额头绿色能量水晶 (Beam Lamp)
                        ctx.beginPath();
                        ctx.arc(5 * f, -16, 3.5, 0, Math.PI * 2);
                        ctx.fillStyle = '#34d399';
                        ctx.shadowColor = '#10b981';
                        ctx.shadowBlur = 12;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }

                    // 电影级高辉度奥特之眼 (Photorealistic Glowing Ultra Eyes)
                    ctx.beginPath();
                    ctx.moveTo(1 * f, -12);
                    ctx.quadraticCurveTo(9 * f, -16, 14 * f, -7);
                    ctx.quadraticCurveTo(7 * f, 3, 1 * f, -12);

                    const eyeGrad = ctx.createRadialGradient(7 * f, -7, 1, 7 * f, -7, 10);
                    eyeGrad.addColorStop(0, '#ffffff');
                    eyeGrad.addColorStop(0.35, colEye);
                    eyeGrad.addColorStop(1, isBelial ? '#991b1b' : '#d97706');

                    ctx.fillStyle = eyeGrad;
                    ctx.shadowColor = colEye;
                    ctx.shadowBlur = 18;
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.shadowBlur = 0;

                    ctx.restore();
                };

                // ---- 2. 立体胸腹铠甲与发光 Core 计时器 ----
                const drawUltraTorso = (tx, ty) => {
                    ctx.save();
                    ctx.translate(tx, ty);

                    // 倒三角霸气胸躯 (V-Taper Muscular Torso)
                    ctx.beginPath();
                    ctx.moveTo(-20 * f, -32);
                    ctx.lineTo(20 * f, -32);
                    ctx.lineTo(13 * f, 18);
                    ctx.lineTo(-13 * f, 18);
                    ctx.closePath();

                    const torsoGrad = ctx.createLinearGradient(-20 * f, -32, 20 * f, 18);
                    torsoGrad.addColorStop(0, isBelial ? '#3f3f46' : '#0284c7');
                    torsoGrad.addColorStop(0.5, colMain);
                    torsoGrad.addColorStop(1, '#09090b');

                    ctx.fillStyle = torsoGrad;
                    ctx.fill();
                    ctx.strokeStyle = isBelial ? '#b91c1c' : '#38bdf8';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // 胸部护铠 (Protector Chest Armor)
                    ctx.beginPath();
                    ctx.moveTo(-18 * f, -30);
                    ctx.lineTo(18 * f, -30);
                    ctx.lineTo(11 * f, -4);
                    ctx.lineTo(-11 * f, -4);
                    ctx.closePath();
                    ctx.fillStyle = colArmor;
                    ctx.fill();
                    ctx.strokeStyle = isBelial ? '#ef4444' : '#0284c7';
                    ctx.lineWidth = 1.8;
                    ctx.stroke();

                    // 铠甲细部雕纹
                    ctx.beginPath();
                    ctx.moveTo(-16 * f, -22); ctx.lineTo(16 * f, -22);
                    ctx.moveTo(-13 * f, -12); ctx.lineTo(13 * f, -12);
                    ctx.strokeStyle = colSub;
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // 胸口 Timer 计时器 (High-Glow Color Timer)
                    ctx.beginPath();
                    ctx.arc(0, -10, 8, 0, Math.PI * 2);
                    ctx.fillStyle = '#09090b';
                    ctx.fill();

                    const timerGrad = ctx.createRadialGradient(0, -10, 1, 0, -10, 7);
                    timerGrad.addColorStop(0, '#ffffff');
                    timerGrad.addColorStop(0.45, colTimer);
                    timerGrad.addColorStop(1, isBelial ? '#6b21a8' : '#0284c7');

                    ctx.beginPath();
                    ctx.arc(0, -10, 6.5, 0, Math.PI * 2);
                    ctx.fillStyle = timerGrad;
                    ctx.shadowColor = colTimer;
                    ctx.shadowBlur = 22;
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.restore();
                };

                // ---- 3. 真实人体肢体姿态与连招渲染 ----
                if (this.state === 'shoryuken') {
                    // 升龙拳：升天姿态
                    drawLimb(0, -25, -14 * f, 15, 9, 7, colMain, colSub);
                    drawLimb(-14 * f, 15, -18 * f, 50, 8, 6, colMain, colSub);
                    drawLimb(0, -25, 18 * f, -5, 10, 8, colMain, colSub);
                    drawLimb(18 * f, -5, 24 * f, 30, 9, 7, colMain, colSub);

                    drawUltraTorso(0, -45);
                    drawUltraHead(0, -78);

                    // 冲天臂
                    drawLimb(10 * f, -55, 22 * f, -108, 10, 7, colArmor, colSub, true);

                } else if (this.state === 'flyingkick') {
                    // 迅猛飞踢
                    drawLimb(-20 * f, -35, -48 * f, -30, 9, 7, colMain, colSub);
                    drawLimb(5 * f, -35, 58 * f, -35, 11, 8, colSub, colArmor);

                    drawUltraTorso(-10 * f, -35);
                    drawUltraHead(-20 * f, -58);

                } else if (this.state === 'attack' && this.currentAttackType) {
                    const isCrouchKick = this.currentAttackType === 'crouch_heavy_kick';
                    const isKick = this.currentAttackType.includes('kick') && !isCrouchKick;
                    const isPunch = this.currentAttackType.includes('punch');
                    const isHadouken = this.currentAttackType === 'hadouken';

                    if (isCrouchKick) {
                        drawLimb(-5 * f, -20, 52 * f, -10, 10, 7, colSub, colArmor);
                        drawUltraTorso(-10 * f, -25);
                        drawUltraHead(-20 * f, -42);
                    } else if (isPunch) {
                        drawLimb(-5 * f, -20, -18 * f, 20, 10, 8, colMain, colSub);
                        drawLimb(-18 * f, 20, -12 * f, 55, 9, 7, colMain, colSub);
                        drawLimb(5 * f, -20, 14 * f, 20, 10, 8, colMain, colSub);
                        drawLimb(14 * f, 20, 22 * f, 55, 9, 7, colMain, colSub);

                        drawUltraTorso(0, -45);
                        drawUltraHead(0, -72);

                        // 强力拳打出
                        drawLimb(10 * f, -55, 58 * f, -55, 10, 8, colArmor, colSub, true);

                    } else if (isKick) {
                        drawLimb(-5 * f, -20, -20 * f, 25, 10, 8, colMain, colSub);
                        drawLimb(5 * f, -20, 52 * f, -45, 11, 8, colSub, colArmor);

                        drawUltraTorso(-10 * f, -45);
                        drawUltraHead(-20 * f, -70);
                    } else if (isHadouken) {
                        // 补全波动拳发波时的双腿下蹲马步姿态
                        drawLimb(-5 * f, -20, -22 * f, 22, 10, 8, colMain, colSub);
                        drawLimb(-22 * f, 22, -15 * f, 55, 9, 7, colMain, colSub);
                        drawLimb(5 * f, -20, 22 * f, 22, 10, 8, colMain, colSub);
                        drawLimb(22 * f, 22, 15 * f, 55, 9, 7, colMain, colSub);

                        drawUltraTorso(0, -45);
                        drawUltraHead(0, -72);

                        // 极光推击双臂
                        drawLimb(10 * f, -55, 52 * f, -45, 10, 8, colArmor, colSub, true);
                        drawLimb(10 * f, -45, 48 * f, -35, 9, 7, colArmor, colSub, true);
                    } else {
                        drawLimb(-5 * f, -20, -18 * f, 20, 10, 8, colMain, colSub);
                        drawLimb(-18 * f, 20, -12 * f, 55, 9, 7, colMain, colSub);
                        drawLimb(5 * f, -20, 18 * f, 20, 10, 8, colMain, colSub);
                        drawLimb(18 * f, 20, 12 * f, 55, 9, 7, colMain, colSub);
                        drawUltraTorso(0, -45);
                        drawUltraHead(0, -72);
                    }
                } else if (isCrouching) {
                    // 下蹲姿势
                    drawLimb(-5 * f, -15, -24 * f, 5, 10, 8, colMain, colSub);
                    drawLimb(-24 * f, 5, -14 * f, 30, 9, 7, colMain, colSub);
                    drawLimb(5 * f, -15, 24 * f, 5, 10, 8, colMain, colSub);
                    drawLimb(24 * f, 5, 14 * f, 30, 9, 7, colMain, colSub);

                    drawUltraTorso(0, -30);
                    drawUltraHead(0, -52);
                } else if (this.state === 'move') {
                    // 动态走动/脚步与双臂交替摆动步态 (Natural Walking Animation Loop)
                    const walkTime = Date.now() / 110;
                    const legSwing1 = Math.sin(walkTime) * 26;
                    const legSwing2 = -legSwing1;
                    const armSwing1 = -legSwing1 * 0.8;
                    const armSwing2 = -armSwing1;
                    const bounceY = Math.abs(Math.sin(walkTime * 2)) * 3; // 走动时的轻微上下起伏

                    // 后腿与前腿交替
                    drawLimb(-5 * f, -20 - bounceY, (-18 + legSwing2 * 0.7) * f, 20, 10, 8, colMain, colSub);
                    drawLimb((-18 + legSwing2 * 0.7) * f, 20, (-12 + legSwing2) * f, 55, 9, 7, colMain, colSub);

                    drawLimb(5 * f, -20 - bounceY, (18 + legSwing1 * 0.7) * f, 20, 10, 8, colMain, colSub);
                    drawLimb((18 + legSwing1 * 0.7) * f, 20, (12 + legSwing1) * f, 55, 9, 7, colMain, colSub);

                    drawUltraTorso(0, -45 - bounceY);
                    drawUltraHead(0, -72 - bounceY);

                    // 后臂与前臂交替摆动
                    drawLimb(-10 * f, -55 - bounceY, (-25 + armSwing2) * f, -40 + Math.abs(armSwing2 * 0.3), 9, 7, colArmor, colSub, true);
                    drawLimb(10 * f, -55 - bounceY, (25 + armSwing1) * f, -40 + Math.abs(armSwing1 * 0.3), 9, 7, colArmor, colSub, true);

                } else {
                    // 默认自然人体格斗姿态
                    drawLimb(-5 * f, -20, -18 * f, 20, 10, 8, colMain, colSub);
                    drawLimb(-18 * f, 20, -12 * f, 55, 9, 7, colMain, colSub);
                    drawLimb(5 * f, -20, 18 * f, 20, 10, 8, colMain, colSub);
                    drawLimb(18 * f, 20, 12 * f, 55, 9, 7, colMain, colSub);

                    drawUltraTorso(0, -45);
                    drawUltraHead(0, -72);

                    // 前置防守手臂
                    drawLimb(-10 * f, -55, -25 * f, -40, 9, 7, colArmor, colSub, true);
                    drawLimb(10 * f, -55, 25 * f, -40, 9, 7, colArmor, colSub, true);
                }

                // 超级大波无限蓄力能量光球
                if (this.state === 'charging') {
                    // 补全蓄力时的扎马步双腿姿势
                    drawLimb(-5 * f, -20, -22 * f, 22, 10, 8, colMain, colSub);
                    drawLimb(-22 * f, 22, -15 * f, 55, 9, 7, colMain, colSub);
                    drawLimb(5 * f, -20, 22 * f, 22, 10, 8, colMain, colSub);
                    drawLimb(22 * f, 22, 15 * f, 55, 9, 7, colMain, colSub);

                    ctx.beginPath();
                    ctx.arc(0, -50, 36 + Math.sin(Date.now() / 40) * 8, 0, Math.PI * 2);
                    ctx.strokeStyle = colTimer;
                    ctx.lineWidth = 4;
                    ctx.shadowColor = colTimer;
                    ctx.shadowBlur = 28;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(0, -50, 22 + Math.cos(Date.now() / 30) * 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.globalAlpha = 0.75;
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                    ctx.shadowBlur = 0;
                }

                ctx.restore();
            }
        }

        let player, ai;
        let projectiles = [];
        let attackEffects = [];
        let floatingTexts = [];

        function updateProjectiles() {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p1 = projectiles[i];
                if (!p1 || !p1.active) continue;

                for (let j = i - 1; j >= 0; j--) {
                    let p2 = projectiles[j];
                    if (!p2 || !p2.active || p1.dir === p2.dir) continue;

                    const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
                    if (dist < p1.radius + p2.radius) {
                        if (p1.isSuper && !p2.isSuper) {
                            if (p1.devourSmallWave()) {
                                p2.active = false;
                                playAudioEffect('explosion');
                                floatingTexts.push(new FloatingText("大波吞噬!", p1.x, p1.y - 20, '#f59e0b'));
                                attackEffects.push(new AttackEffect(p2.x, p2.y, p1.dir, 'heavy_punch'));
                            }
                        } else if (p2.isSuper && !p1.isSuper) {
                            if (p2.devourSmallWave()) {
                                p1.active = false;
                                playAudioEffect('explosion');
                                floatingTexts.push(new FloatingText("大波吞噬!", p2.x, p2.y - 20, '#f59e0b'));
                                attackEffects.push(new AttackEffect(p1.x, p1.y, p2.dir, 'heavy_punch'));
                            }
                        } else if (!p1.isSuper && !p2.isSuper) {
                            p1.active = false;
                            p2.active = false;
                            playAudioEffect('block');
                            floatingTexts.push(new FloatingText("波动相杀!", (p1.x + p2.x) / 2, p1.y - 20, '#38bdf8'));
                            attackEffects.push(new AttackEffect((p1.x + p2.x) / 2, p1.y, 1, 'punch'));
                        }
                    }
                }
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                if (!p.active) {
                    projectiles.splice(i, 1);
                    continue;
                }

                p.update();

                [player, ai].forEach(target => {
                    if (target.facing !== p.dir && p.active) {
                        const dist = Math.hypot(p.x - target.x, p.y - (target.y - 35));
                        if (dist < p.radius + 15) {
                            p.active = false;
                            target.takeHit(p.damage, p.isSuper, p.dir * (p.isSuper ? 8 : 3), p.isSuper ? -8 : -2);
                            attackEffects.push(new AttackEffect(target.x, target.y - 35, p.dir, p.isSuper ? 'heavy_punch' : 'punch'));
                            floatingTexts.push(new FloatingText(p.isSuper ? "大波重创!" : "命中!", target.x, target.y - 60, '#f43f5e'));
                        }
                    }
                });
            }
        }

        function checkAttackCollisions(attacker, defender) {
            if (attacker.state === 'attack' && attacker.currentAttackType && attacker.stateTimer === 10) {
                const dist = Math.abs(attacker.x - defender.x);
                const isCrouchKick = attacker.currentAttackType === 'crouch_heavy_kick';
                const hitDist = (isCrouchKick ? 55 : 45) * attacker.scale; // 随着体型缩放攻击范围

                if (dist < hitDist && Math.abs(attacker.y - defender.y) < 35 * attacker.scale) {
                    const isHeavy = attacker.currentAttackType.includes('heavy');
                    const dmg = (isHeavy ? 12 : 6) * attacker.dmgMultiplier;
                    defender.takeHit(dmg, isHeavy || isCrouchKick, attacker.facing * (isHeavy ? 5 : 2), isCrouchKick ? -6 : (isHeavy ? -4 : 0));
                    attackEffects.push(new AttackEffect(defender.x, defender.y - (isCrouchKick ? 10 : 30) * defender.scale, attacker.facing, attacker.currentAttackType));
                    floatingTexts.push(new FloatingText(isCrouchKick ? "扫堂腿!" : (isHeavy ? "重击!" : "轻击!"), defender.x, defender.y - 50 * defender.scale, '#38bdf8'));
                }
            }

            if (attacker.state === 'shoryuken' && attacker.isInvincible) {
                const dist = Math.hypot(attacker.x - defender.x, attacker.y - defender.y);
                if (dist < 50 * attacker.scale) {
                    defender.takeHit(25 * attacker.dmgMultiplier, true, attacker.facing * 6, -10);
                    attackEffects.push(new AttackEffect(defender.x, defender.y - 40 * defender.scale, attacker.facing, 'heavy_punch'));
                    floatingTexts.push(new FloatingText("升龙破空!", defender.x, defender.y - 60 * defender.scale, '#eab308'));
                }
            }

            if (attacker.state === 'flyingkick' && attacker.stateTimer > 10) {
                const dist = Math.hypot(attacker.x - defender.x, (attacker.y - 20) - (defender.y - 20));
                if (dist < 45 * attacker.scale) {
                    defender.takeHit(20 * attacker.dmgMultiplier, true, attacker.facing * 9, -5);
                    attacker.vx = -attacker.facing * 3;
                    attacker.stateTimer = 10;
                    attackEffects.push(new AttackEffect(defender.x, defender.y - 25 * defender.scale, attacker.facing, 'heavy_kick'));
                    floatingTexts.push(new FloatingText("迅猛飞踢!", defender.x, defender.y - 60 * defender.scale, '#38bdf8'));
                }
            }
        }

        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);
            ctx.fillStyle = '#475569';
            ctx.fillRect(0, GROUND_Y, GAME_WIDTH, 4);

            if (!isCountingDown) {
                player.update(ai, projectiles, floatingTexts);
                ai.update(player, projectiles, floatingTexts);

                checkAttackCollisions(player, ai);
                checkAttackCollisions(ai, player);

                updateProjectiles();
            }

            player.draw(ctx);
            ai.draw(ctx);

            projectiles.forEach(p => p.draw(ctx));

            for (let i = attackEffects.length - 1; i >= 0; i--) {
                let fx = attackEffects[i];
                fx.update();
                fx.draw(ctx);
                if (fx.life <= 0) attackEffects.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.update();
                ft.draw(ctx);
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }

            drawUI();

            if (!isCountingDown && (player.hp <= 0 || ai.hp <= 0)) {
                gameRunning = false;
                stopBGM(); // 战斗结束停止 BGM
                const overlay = document.getElementById('game-over-overlay');
                const winnerText = document.getElementById('winner-text');
                const subtext = document.getElementById('stage-subtext');
                const nextBtn = document.getElementById('next-stage-btn');

                if (player.hp > 0) {
                    if (currentStage < MAX_STAGE) {
                        winnerText.textContent = `第 ${currentStage} 关 胜利!`;
                        subtext.textContent = `下一关敌方体型更庞大，伤害大幅提升！`;
                        nextBtn.classList.remove('hidden');
                    } else {
                        winnerText.textContent = '🎉 全关卡完美通关!';
                        subtext.textContent = '恭喜赛罗奥特曼战胜终极极恶贝利亚！';
                        nextBtn.classList.add('hidden');
                    }
                } else {
                    winnerText.textContent = '败北... 游戏结束';
                    subtext.textContent = `被 ${STAGE_CONFIGS[currentStage].name} 击败`;
                    nextBtn.classList.add('hidden');
                }

                overlay.classList.remove('hidden');
                return;
            }

            requestAnimationFrame(gameLoop);
        }

        function drawUI() {
            // 玩家血条
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(20, 20, 300, 20);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(20, 20, Math.max(0, player.hp * 3), 20);
            ctx.strokeStyle = '#0284c7';
            ctx.strokeRect(20, 20, 300, 20);

            // AI 血条（根据 Boss 最大血量比例计算）
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(GAME_WIDTH - 320, 20, 300, 20);
            ctx.fillStyle = '#ef4444';
            const aiHpPct = Math.max(0, (ai.hp / ai.maxHp) * 300);
            ctx.fillRect(GAME_WIDTH - 320 + (300 - aiHpPct), 20, aiHpPct, 20);
            ctx.strokeStyle = '#b91c1c';
            ctx.strokeRect(GAME_WIDTH - 320, 20, 300, 20);

            ctx.font = '900 13px Inter, sans-serif';
            ctx.fillStyle = '#38bdf8';
            ctx.fillText('1P: 赛罗奥特曼 (ZERO)', 20, 15);

            ctx.fillStyle = '#ef4444';
            ctx.fillText(`2P: 贝利亚 [${STAGE_CONFIGS[currentStage].name}]`, GAME_WIDTH - 240, 15);

            // 顶部关卡指示徽章 (Stage Banner)
            ctx.fillStyle = '#f59e0b';
            ctx.font = '900 16px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`STAGE ${currentStage} / ${MAX_STAGE}`, GAME_WIDTH / 2, 28);
            ctx.textAlign = 'left';
        }

        window.onload = () => {
            currentStage = 1;
            player = new Stickman(200, '#38bdf8', false);
            setupAIForStage(currentStage);
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);
            ctx.fillStyle = '#475569';
            ctx.fillRect(0, GROUND_Y, GAME_WIDTH, 4);
            player.draw(ctx);
            ai.draw(ctx);
            drawUI();
        };
    </script>
